# Separate commercial beta. Never apply this file to Team Alpha's services.
# Select this filename and feature/studio-x-os-commercial-beta in Render.
services:
  - type: web
    name: studio-x-os-api
    runtime: node
    region: singapore
    plan: free
    branch: feature/studio-x-os-commercial-beta
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.13.0
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: VAULT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://studioxos.com
      - key: API_PUBLIC_URL
        sync: false
      - key: SAAS_ENABLED
        value: "true"
      - key: SAAS_SIGNUP_ENABLED
        value: "false"
      - key: WORKSPACE_RECOVERY_ENABLED
        value: "false"
      - key: APNS_ENABLED
        value: "false"
  - type: web
    name: studio-x-os
    runtime: static
    branch: feature/studio-x-os-commercial-beta
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: VITE_STUDIO_DEPLOYMENT
        value: commercial
      - key: VITE_STUDIO_SAAS_ENABLED
        value: "true"
      - key: VITE_API_URL
        sync: false
      - key: VITE_SITE_ORIGIN
        value: https://studioxos.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /index.html
        name: Cache-Control
        value: no-cache
